configurations {
    pdfLibs
    chartLibs
}

repositories {
    mavenCentral()
}

dependencies {
    // PDF generation libraries
    pdfLibs 'org.apache.pdfbox:pdfbox:2.0.29'
    pdfLibs 'org.apache.pdfbox:fontbox:2.0.29'

    // Chart generation libraries
    chartLibs 'org.jfree:jfreechart:1.5.4'
    chartLibs 'org.jfree:jcommon:1.0.24'
}

task copyLibs(type: Copy) {
    from configurations.pdfLibs
    from configurations.chartLibs
    into 'lib'
}

// Ensure libs are copied before compilation
compileJava.dependsOn copyLibs

// Publish feature manifest to features directory
task publishFeatureManifests(type: Copy) {
    dependsOn jar
    from project.file('publish/features')
    into buildImage.file('wlp/lib/features')
    include '*.mf'
}

assemble.dependsOn publishFeatureManifests
