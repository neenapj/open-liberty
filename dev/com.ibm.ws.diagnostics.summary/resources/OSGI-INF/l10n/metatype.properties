#CMVCPATHNAME com.ibm.ws.diagnostics.summary/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE
#

# Diagnostic Summary Feature
diagnosticSummary=Diagnostic Summary
diagnosticSummary.desc=Automatically detects and analyzes runtime issues, generating comprehensive diagnostic reports with trace recommendations and delivering them via email.

# Core Settings
enabled=Enabled
enabled.desc=Enable or disable the diagnostic summary feature.

mailSessionRef=Mail Session Reference
mailSessionRef.desc=Reference to a configured mail session for sending diagnostic reports via email.

# Email Recipients
emailRecipients=Email Recipients
emailRecipients.desc=List of email recipients who will receive diagnostic reports.

emailRecipient=Email Recipient
emailRecipient.desc=Configuration for an email recipient.

email=Email Address
email.desc=The email address of the recipient.

type=Recipient Type
type.desc=The type of recipient (To, CC, or BCC).
type.to=To
type.cc=CC
type.bcc=BCC

# Immediate Triggers
immediateTriggers=Immediate Triggers
immediateTriggers.desc=Configuration for immediate diagnostic report triggers based on runtime events.

exceptionTrigger.enabled=Exception Trigger Enabled
exceptionTrigger.enabled.desc=Enable immediate report generation when repeated exceptions are detected.

exceptionTrigger.threshold=Exception Threshold
exceptionTrigger.threshold.desc=Number of similar exceptions within the time window that triggers a report.

exceptionTrigger.timeWindow=Exception Time Window
exceptionTrigger.timeWindow.desc=Time window for counting exceptions (e.g., 10m, 1h, 30s).

exceptionTrigger.severity=Exception Severity
exceptionTrigger.severity.desc=Comma-separated list of exception severities that trigger reports (CRITICAL, HIGH, MEDIUM, LOW).

# Scheduled Analysis
scheduledAnalysis=Scheduled Analysis
scheduledAnalysis.desc=Configuration for scheduled proactive diagnostic analysis.

scheduledAnalysis.enabled=Scheduled Analysis Enabled
scheduledAnalysis.enabled.desc=Enable scheduled proactive analysis and reporting.

schedule=Schedule
schedule.desc=Cron expression for scheduled analysis (e.g., "0 */4 * * *" for every 4 hours).

timezone=Timezone
timezone.desc=Timezone for the schedule (e.g., "America/New_York", "UTC"). If not specified, uses server timezone.

minIssuesForReport=Minimum Issues for Report
minIssuesForReport.desc=Minimum number of issues that must be detected before generating a scheduled report.

# Manual Trigger
manualTrigger.enabled=Manual Trigger Enabled
manualTrigger.enabled.desc=Enable manual triggering of diagnostic reports via MBean or REST API.

# Report Options
reportOptions=Report Options
reportOptions.desc=Configuration options for diagnostic report generation.

includeFullStackTraces=Include Full Stack Traces
includeFullStackTraces.desc=Include complete stack traces in the diagnostic report.

generatePDF=Generate PDF
generatePDF.desc=Generate a PDF version of the diagnostic report.

pdfIncludeCharts=PDF Include Charts
pdfIncludeCharts.desc=Include charts and visualizations in the PDF report.

# Trace Recommendations
traceRecommendations=Trace Recommendations
traceRecommendations.desc=Configuration for trace string recommendations in diagnostic reports.

traceRecommendations.enabled=Trace Recommendations Enabled
traceRecommendations.enabled.desc=Include trace string recommendations in diagnostic reports.

traceRecommendations.includeLogVolume=Include Log Volume Estimates
traceRecommendations.includeLogVolume.desc=Include estimated log volume for each trace recommendation.

traceRecommendations.includePerformanceImpact=Include Performance Impact
traceRecommendations.includePerformanceImpact.desc=Include performance impact warnings for trace recommendations.

# External Content Fetching
externalContentFetching=External Content Fetching
externalContentFetching.desc=Configuration for fetching external content (APARs, GitHub issues, documentation).

externalContentFetching.enabled=External Content Fetching Enabled
externalContentFetching.enabled.desc=Enable fetching of external content from IBM Support, GitHub, and documentation sites.

externalContentFetching.githubToken=GitHub Token
externalContentFetching.githubToken.desc=GitHub personal access token for API access (optional, increases rate limits).

externalContentFetching.cacheEnabled=Cache Enabled
externalContentFetching.cacheEnabled.desc=Enable caching of external content to reduce API calls.

externalContentFetching.cacheTTL=Cache TTL
externalContentFetching.cacheTTL.desc=Time-to-live for cached content in hours (default: 24 hours).

externalContentFetching.timeout=Timeout
externalContentFetching.timeout.desc=Timeout for external API calls in seconds (default: 30 seconds).

